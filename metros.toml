# Metros on the dashboard. Adding a metro = adding a [[metro]] block.

[assumptions]
down_payment = 0.20
term_years = 30

# One hand-written line shown above the cards on every view. Rewrite it when the weekly data lands.
[weekly]
label = "11/6 Week Update"
text = "The 30-year rate fell for a second week, to 7.18% from 7.32%. Redfin sales data now runs through September (it was stuck at May) after Redfin moved to new files; metro figures are now seasonally adjusted, so some cards shift from earlier levels. September permits brought a multifamily jump to 2,212 units from 777 while single-family slipped to 1,045, and new 2025 Census figures put metro median family income at $131,639, up 3.3%."

[[metro]]
id = "austin-tx"
name = "Austin, TX"
cbsa = "12420"               # Census CBSA code; also Redfin's REGION ID
redfin_name = "Austin, TX metro area"   # Redfin REGION NAME; price drop files have no region id
zillow_region_id = "394355"
default_region = "travis"    # county shown at re-dash.com/ with no hash
# ASSUMPTIONS, not sourced data - replace with real county figures:
property_tax_rate = 0.019    # effective annual rate, placeholder estimate
insurance_annual = 3000      # USD per year homeowners insurance, placeholder estimate

# Counties in the metro. fips = state + county code; redfin_table_id is Redfin's county REGION ID.
# Counties use the metro's property tax and insurance placeholders.
[[metro.county]]
id = "travis"
name = "Travis County"
redfin_name = "Travis County, TX"
fips = "48453"
redfin_table_id = "2866"
zillow_region_id = "1440"

