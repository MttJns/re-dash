# Metros on the dashboard. Adding a metro = adding a [[metro]] block.

[assumptions]
down_payment = 0.20
term_years = 30

[[metro]]
id = "austin-tx"
name = "Austin, TX"
cbsa = "12420"               # Census CBSA code; also Redfin's TABLE_ID
zillow_region_id = "394355"
default_region = "travis"    # county shown at re-dash.com/ with no hash
# ASSUMPTIONS, not sourced data - replace with real county figures:
property_tax_rate = 0.019    # effective annual rate, placeholder estimate
insurance_annual = 3000      # USD per year homeowners insurance, placeholder estimate

# Counties in the metro. fips = state + county code; redfin_table_id is Redfin's county TABLE_ID.
# Counties use the metro's property tax and insurance placeholders.
[[metro.county]]
id = "travis"
name = "Travis County"
fips = "48453"
redfin_table_id = "2866"
zillow_region_id = "1440"

